server.port=8089
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/orbit}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:orbit}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:orbit}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.sql.init.mode=never
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.jackson.serialization.write-dates-as-timestamps=false
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
orbit.zone=${ORBIT_ZONE:Europe/Paris}
orbit.stay-secret=${ORBIT_STAY_SECRET:orbit-local-diary-stay-7f3c9a2e}
